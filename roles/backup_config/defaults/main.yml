---
# defaults file for backup_config

# Sử dụng tên biến có tiền tố role để tránh xung đột.
# Dùng {{ playbook_dir }} để đường dẫn luôn đúng.
backup_config_backup_root: "{{ playbook_dir }}/backups"

# Chế độ backup mặc định. Có thể override trong inventory hoặc group_vars.
backup_config_backup_mode: "running-config"

