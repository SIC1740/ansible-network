---
# tasks file for backup_config

- name: "Tạo thư mục backup trên control node cho {{ inventory_hostname }}"
  ansible.builtin.file:
    # SỬA: Dùng tên biến mới backup_config_backup_root
    path: "{{ backup_config_backup_root }}/{{ inventory_hostname }}"
    state: directory
    mode: '0755'
  delegate_to: localhost

- name: "Sao lưu {{ backup_config_backup_mode }} của {{ inventory_hostname }}"
  cisco.ios.ios_config:
    backup: true
    backup_options:
      # SỬA: Dùng tên biến mới backup_config_backup_root
      dir_path: "{{ backup_config_backup_root }}/{{ inventory_hostname }}"
      filename: "{{ lookup('pipe', 'date +%Y%m%dT%H%M%S') }}.cfg"
  tags: backup
  register: backup_result
  # SỬA: Gọi đúng tên handler mới
  notify: Log_backup_path

