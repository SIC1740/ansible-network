---
- name: Backup running-config via SSH (NAT R-W) - no become/authorize
  hosts: routers:switches
  gather_facts: false
  become: false
  collections: [ansible.netcommon]

  vars:
    backup_root: "{{ playbook_dir }}/backups"
    enable_secret: "cisco123"
    github_username: "SIC1740"
    github_repo: "ansible-network"
    github_owner: "SIC1740"

  pre_tasks:
    - name: Freeze timestamp once
      set_fact:
        ts: "{{ lookup('pipe','date +%Y%m%d_%H%M%S') }}"
    - name: Build host_dir from ts
      set_fact:
        host_dir: "{{ backup_root }}/{{ inventory_hostname }}/{{ ts }}"
    - name: Ensure timestamp folder
      delegate_to: localhost
      ansible.builtin.file:
        path: "{{ host_dir }}"
        state: directory
        mode: "0755"
    - name: Wait for SSH port reachable on target
      delegate_to: localhost
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ ansible_port | default(22) }}"
        timeout: 15

  tasks:
    - name: terminal length 0
      ansible.netcommon.cli_command:
        command: "terminal length 0"
    - name: show running-config
      ansible.netcommon.cli_command:
        command: "show running-config"
      register: run
    - name: Save running-config to file
      delegate_to: localhost
      ansible.builtin.copy:
        content: "{{ run.stdout | default(run.stdout_lines | join('\n')) }}"
        dest: "{{ host_dir }}/{{ inventory_hostname }}_running_{{ ts }}.cfg"
        mode: "0644"

  post_tasks:
    - name: Add backup files to git
      ansible.builtin.command:
        cmd: git add playbooks/backups/
      args:
        chdir: /runner/project

    - name: Commit backup changes
      ansible.builtin.command:
        cmd: git commit -m "Backup on {{ ansible_date_time.date }} {{ ansible_date_time.time }}"
      args:
        chdir: /runner/project
      ignore_errors: yes

    - name: Push backup to GitHub
      ansible.builtin.command:
        cmd: >
          git push https://{{ github_username }}:{{ lookup('env','GITHUB_TOKEN') }}@github.com/{{ github_owner }}/{{ github_repo }}.git
      args:
        chdir: /runner/project

