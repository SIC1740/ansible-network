---
- name: Backup running-config via SSH (NAT R-W) - no become/authorize
  hosts: routers:switches
  gather_facts: false
  become: false
  collections: [ansible.netcommon]

  vars:
    backup_root: "{{ playbook_dir }}/backups"
    enable_secret: "cisco123"
    github_owner: "SIC1740"
    github_repo: "ansible-network"
    github_username: "SIC1740"
    git_branch: "main"
    git_user_email: "sivv.b21vt378@stu.ptit.edu.vn"

  pre_tasks:
    - name: Freeze timestamp once
      set_fact:
        ts: "{{ lookup('pipe','date +%Y%m%d_%H%M%S') }}"
    - name: Build host_dir from ts
      set_fact:
        host_dir: "{{ backup_root }}/{{ inventory_hostname }}/{{ ts }}"
    - name: Ensure base folder
      delegate_to: localhost
      ansible.builtin.file:
        path: "{{ backup_root }}"
        state: directory
        mode: "0755"
    - name: Ensure host folder
      delegate_to: localhost
      ansible.builtin.file:
        path: "{{ backup_root }}/{{ inventory_hostname }}"
        state: directory
        mode: "0755"
    - name: Ensure timestamp folder
      delegate_to: localhost
      ansible.builtin.file:
        path: "{{ host_dir }}"
        state: directory
        mode: "0755"

    # Kiểm tra cổng SSH tới đúng đích (qua NAT)
    - name: Wait for SSH port reachable on target
      delegate_to: localhost
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ ansible_port | default(22) }}"
        timeout: 15

  tasks:
    # Lấy privilege hiện tại; nếu SW đã vào privilege 15 thì không cần enable
    - name: Check privilege level
      ansible.netcommon.cli_command:
        command: "show privilege"
      register: priv
      failed_when: false

    - name: Enable only if not level 15
      ansible.netcommon.cli_command:
        command: "enable"
        prompt: "Password:"
        answer: "{{ enable_secret }}"
      when: >
        (priv is not failed) and
        (
          (priv.stdout is defined and ('15' not in priv.stdout)) or
          (priv.stdout is not defined and (priv.stdout_lines | default([]) | join(' ') is search('15') | ternary(false, true)))
        )
      failed_when: false

    - name: terminal length 0
      ansible.netcommon.cli_command:
        command: "terminal length 0"

    - name: show running-config
      ansible.netcommon.cli_command:
        command: "show running-config"
      register: run

    - name: Save running-config to file
      delegate_to: localhost
      ansible.builtin.copy:
        content: "{{ run.stdout | default(run.stdout_lines | join('\n')) | default('') }}"
        dest: "{{ host_dir }}/{{ inventory_hostname }}_running_{{ ts }}.cfg"
        mode: "0644"

  post_tasks:
  - name: Build commit message & repo URL
    set_fact:
      commit_msg: "backup {{ ts }} (AWX job {{ tower_job_id | default('manual') }})"
      repo_url_https: "https://{{ github_username }}:{{ github_token }}@github.com/{{ github_owner }}/{{ github_repo }}.git"
    run_once: true

  - name: Check git exists
    command: bash -lc "git --version"
    register: _git_ver
    changed_when: false
    run_once: true

  - name: Allow git safe.directory (root in container)
    block:
      - command: git config --global --add safe.directory /runner/project
      - command: git config --global --add safe.directory /tmp/repo_push
    run_once: true

  - name: Does Project have .git?
    stat:
      path: /runner/project/.git
    register: _git_here
    run_once: true

  # ===== NHÁNH A: có .git tại /runner/project -> commit/push in-place
  - name: IN-PLACE | config, add, commit, pull --rebase, push
    block:
      - command: git config user.name "{{ git_user_name }}"
        args: { chdir: /runner/project }
      - command: git config user.email "{{ git_user_email }}"
        args: { chdir: /runner/project }

      - name: Ensure origin uses HTTPS+token
        command: git remote set-url origin "{{ repo_url_https }}"
        args: { chdir: /runner/project }

      - command: git add playbooks/backups/
        args: { chdir: /runner/project }

      - command: git commit -m "{{ commit_msg }}"
        args: { chdir: /runner/project }
        register: _commit_inplace
        failed_when: _commit_inplace.rc not in [0,1]   # 1 = không có gì để commit

      - command: git pull --rebase origin "{{ git_branch }}"
        args: { chdir: /runner/project }

      - command: git push origin "{{ git_branch }}"
        args: { chdir: /runner/project }
    when: _git_here.stat.exists
    run_once: true
    no_log: "{{ not debug_git | default(false) }}"

  # ===== NHÁNH B: không có .git -> clone tạm, copy, commit, push
  - name: TEMP CLONE | clone → copy backups → commit → push
    block:
      - file:
          path: /tmp/repo_push
          state: absent
      - git:
          repo: "{{ repo_url_https }}"
          dest: /tmp/repo_push
          version: "{{ git_branch }}"
          force: true

      - file:
          path: /tmp/repo_push/playbooks/backups
          state: directory
          mode: "0755"

      - name: Copy backups from /runner/project to temp repo
        shell: |
          set -e
          src="/runner/project/playbooks/backups"
          dst="/tmp/repo_push/playbooks/backups"
          mkdir -p "$dst"
          if [ -d "$src" ]; then
            cp -a "$src/." "$dst/"
          fi
        args: { executable: /bin/bash }

      - command: git config user.name "{{ git_user_name }}"
        args: { chdir: /tmp/repo_push }
      - command: git config user.email "{{ git_user_email }}"
        args: { chdir: /tmp/repo_push }

      - command: git add playbooks/backups/
        args: { chdir: /tmp/repo_push }

      - command: git commit -m "{{ commit_msg }}"
        args: { chdir: /tmp/repo_push }
        register: _commit_tmp
        failed_when: _commit_tmp.rc not in [0,1]

      - command: git pull --rebase origin "{{ git_branch }}"
        args: { chdir: /tmp/repo_push }

      - command: git push origin "{{ git_branch }}"
        args: { chdir: /tmp/repo_push }
    when: not _git_here.stat.exists
    run_once: true
    no_log: "{{ not debug_git | default(false) }}"


