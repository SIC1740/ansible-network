---
- name: Backup running-config via SSH (NAT R-W) - no become/authorize
  hosts: routers:switches
  gather_facts: false
  become: false
  collections: [ansible.netcommon]

  vars:
    backup_root: "{{ playbook_dir }}/backups"
    enable_secret: "cisco123"
    github_username: "SIC1740"
    github_repo: "ansible-network"
    github_owner: "SIC1740"

  pre_tasks:
    - name: Freeze timestamp once
      set_fact:
        ts: "{{ lookup('pipe','date +%Y%m%d_%H%M%S') }}"
    - name: Build host_dir from ts
      set_fact:
        host_dir: "{{ backup_root }}/{{ inventory_hostname }}/{{ ts }}"
    - name: Ensure base folder
      delegate_to: localhost
      ansible.builtin.file:
        path: "{{ backup_root }}"
        state: directory
        mode: "0755"
    - name: Ensure host folder
      delegate_to: localhost
      ansible.builtin.file:
        path: "{{ backup_root }}/{{ inventory_hostname }}"
        state: directory
        mode: "0755"
    - name: Ensure timestamp folder
      delegate_to: localhost
      ansible.builtin.file:
        path: "{{ host_dir }}"
        state: directory
        mode: "0755"

    # Kiểm tra cổng SSH tới đúng đích (qua NAT)
    - name: Wait for SSH port reachable on target
      delegate_to: localhost
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ ansible_port | default(22) }}"
        timeout: 15

  tasks:
    # Lấy privilege hiện tại; nếu SW đã vào privilege 15 thì không cần enable
    - name: Check privilege level
      ansible.netcommon.cli_command:
        command: "show privilege"
      register: priv
      failed_when: false

    - name: Enable only if not level 15
      ansible.netcommon.cli_command:
        command: "enable"
        prompt: "Password:"
        answer: "{{ enable_secret }}"
      when: >
        (priv is not failed) and
        (
          (priv.stdout is defined and ('15' not in priv.stdout)) or
          (priv.stdout is not defined and (priv.stdout_lines | default([]) | join(' ') is search('15') | ternary(false, true)))
        )
      failed_when: false

    - name: terminal length 0
      ansible.netcommon.cli_command:
        command: "terminal length 0"

    - name: show running-config
      ansible.netcommon.cli_command:
        command: "show running-config"
      register: run

    - name: Save running-config to file
      delegate_to: localhost
      ansible.builtin.copy:
        content: "{{ run.stdout | default(run.stdout_lines | join('\n')) | default('') }}"
        dest: "{{ host_dir }}/{{ inventory_hostname }}_running_{{ ts }}.cfg"
        mode: "0644"

  post_tasks:
  # Msg commit dùng chung
  - name: Set commit message
    set_fact:
      commit_msg: "backup {{ ts }} (AWX job {{ tower_job_id | default('manual') }})"
    run_once: true

  # Kiểm tra repo của Project có .git không
  - name: Check if Project has .git
    ansible.builtin.stat:
      path: /runner/project/.git
    register: _git_here
    run_once: true

  # Nhánh A: Commit & push NGAY TRONG /runner/project (nếu có .git)
  - name: GIT IN-PLACE | set user/email + remote
    block:
      - ansible.builtin.command:
          cmd: git config user.name "{{ git_user_name }}"
          chdir: /runner/project
      - ansible.builtin.command:
          cmd: git config user.email "{{ git_user_email }}"
          chdir: /runner/project
      - ansible.builtin.command:  # đảm bảo remote dùng HTTPS + token
          cmd: git remote set-url origin https://{{ github_username }}:{{ github_token }}@github.com/{{ github_owner }}/{{ github_repo }}.git
          chdir: /runner/project
        no_log: true

      - ansible.builtin.command:
          cmd: git add playbooks/backups/
          chdir: /runner/project

      - ansible.builtin.command:
          cmd: git commit -m "{{ commit_msg }}"
          chdir: /runner/project
        register: _commit_inplace
        failed_when: _commit_inplace.rc not in [0,1]   # 1 = không có gì để commit

      - ansible.builtin.command:
          cmd: git pull --rebase origin "{{ git_branch }}"
          chdir: /runner/project

      - ansible.builtin.command:
          cmd: git push origin "{{ git_branch }}"
          chdir: /runner/project
    when: _git_here.stat.exists
    run_once: true
    delegate_to: localhost
    no_log: true   # ẩn URL chứa token trong log

  # Nhánh B: Nếu KHÔNG có .git → clone repo tạm, copy backups vào, rồi commit & push
  - name: GIT VIA TEMP CLONE | clone, copy, commit, push
    block:
      - ansible.builtin.file:
          path: /tmp/repo_push
          state: absent
      - ansible.builtin.git:
          repo: "https://{{ github_username }}:{{ github_token }}@github.com/{{ github_owner }}/{{ github_repo }}.git"
          dest: /tmp/repo_push
          version: "{{ git_branch }}"
          force: true
        no_log: true

      - ansible.builtin.file:
          path: /tmp/repo_push/playbooks/backups
          state: directory
          mode: "0755"

      - name: Copy all generated backups into temp repo
        ansible.builtin.shell: |
          set -e
          src="/runner/project/playbooks/backups"
          dst="/tmp/repo_push/playbooks/backups"
          mkdir -p "$dst"
          if [ -d "$src" ]; then
            cp -a "$src/." "$dst/"
          fi
        args:
          executable: /bin/bash

      - ansible.builtin.command:
          cmd: git config user.name "{{ git_user_name }}"
          chdir: /tmp/repo_push
      - ansible.builtin.command:
          cmd: git config user.email "{{ git_user_email }}"
          chdir: /tmp/repo_push

      - ansible.builtin.command:
          cmd: git add playbooks/backups/
          chdir: /tmp/repo_push

      - ansible.builtin.command:
          cmd: git commit -m "{{ commit_msg }}"
          chdir: /tmp/repo_push
        register: _commit_tmp
        failed_when: _commit_tmp.rc not in [0,1]

      - ansible.builtin.command:
          cmd: git pull --rebase origin "{{ git_branch }}"
          chdir: /tmp/repo_push

      - ansible.builtin.command:
          cmd: git push origin "{{ git_branch }}"
          chdir: /tmp/repo_push
    when: not _git_here.stat.exists
    run_once: true
    delegate_to: localhost
    no_log: true

