[defaults]
inventory = inventories/hosts.yml
host_key_checking = False
retry_files_enabled = False

# ✅ FIXED: Sử dụng built-in default callback với YAML format
stdout_callback = default
result_format = yaml

# ✅ Alternative: Hoặc dùng built-in yaml callback
# stdout_callback = yaml

#collections_path = /home/ubuntu/.ansible/collections
roles_path = ./roles 
timeout = 30
strategy = free                
interpreter_python = auto_silent

# ✅ FIXED: Disable deprecation warnings nếu muốn
deprecation_warnings = False

[privilege_escalation]
become = False

[ssh_connection]
ssh_args = -o KexAlgorithms=+diffie-hellman-group-exchange-sha1,+diffie-hellman-group14-sha1,+diffie-hellman-group1-sha1 -o HostKeyAlgorithms=+ssh-rsa
pipelining = True

[persistent_connection]
ssh_type = paramiko
connect_timeout = 60
command_timeout = 60
retries = 3

[paramiko_connection]
look_for_keys = False
host_key_checking = False

